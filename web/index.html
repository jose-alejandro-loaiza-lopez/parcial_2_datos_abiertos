<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Colombia Open Data: aplicación Flutter que explora departamentos, presidentes, atracciones turísticas y regiones de Colombia con la API Colombia.">
  <meta name="author" content="José Alejandro Loaiza López">
  <meta name="theme-color" content="#0D2137">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Colombia Open Data">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Colombia Open Data | José Alejandro Loaiza López</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      color-scheme: dark;
      --app-bg: #f5f7fb;
      --page-bg: #0d2137;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--page-bg);
    }

    body {
      background:
        radial-gradient(circle at 50% -10%, #1d4266 0%, transparent 55%),
        linear-gradient(160deg, #0d2137 0%, #071523 100%);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    /* Escenario que centra la demo en pantallas de escritorio. */
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    /* Marco vertical 9:18 (equivalente a un celular moderno). */
    #phone {
      position: relative;
      width: min(calc((100dvh - 48px) * 0.5), calc(100vw - 48px), 430px);
      aspect-ratio: 9 / 18;
      overflow: hidden;
      border-radius: 30px;
      background: var(--app-bg);
      box-shadow:
        0 0 0 10px #0b1118,
        0 0 0 12px #2a3947,
        0 40px 90px rgba(0, 0, 0, 0.55);
    }

    /* El motor de Flutter se monta dentro de este contenedor. */
    #flutter-host {
      width: 100%;
      height: 100%;
    }

    #boot {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #607089;
      font-size: 14px;
      letter-spacing: 0.02em;
      text-align: center;
      pointer-events: none;
    }

    /* En celulares la aplicación ocupa toda la pantalla. */
    @media (max-width: 640px) {
      #stage {
        padding: 0;
      }

      #phone {
        width: 100vw;
        height: 100dvh;
        aspect-ratio: auto;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="phone" role="application" aria-label="Demo de Colombia Open Data">
      <div id="boot">Cargando Colombia Open Data…</div>
      <div id="flutter-host"></div>
    </div>
  </div>

  <noscript>Esta aplicación necesita JavaScript para ejecutarse.</noscript>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
